<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#1f6feb">
        <animate attributeName="offset" values="0.35;0.65;0.35" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="200" rx="14" fill="url(#g)"/>
  <circle cx="880" cy="40" r="90" fill="#ffffff" opacity="0.05">
    <animate attributeName="cy" values="40;60;40" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="170" r="70" fill="#ffffff" opacity="0.05">
    <animate attributeName="cy" values="170;150;170" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Shubham Ojha
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="500" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#d2e3ff">Backend &amp; AI Enthusiast
    <animate attributeName="opacity" values="0;1" begin="0.8s" dur="1.5s" fill="freeze"/>
  </text>
</svg>
